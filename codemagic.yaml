workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    environment:
      flutter: 3.41.5
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store   # змінити на ad_hoc для тестування без App Store
        bundle_identifier: com.huntingsignals.app
      vars:
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...)  # заповнити в Codemagic
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...)
        CERTIFICATE_PRIVATE_KEY: Encrypted(...)
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your@email.com   # замінити на свою пошту
        notify:
          success: true
          failure: true
